
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1220">

    <title>Genesis | Lunar Sleep Scheduler</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="./manifest.json">
</head>
<body class="linear-basic">

    <header>
        <h1 class="title" style="text-align: center;">GENESIS</h1>
        <p style="text-align: center;">The Lunar Sleep-Shift Scheduling Tool</p>
    </header>

    <main>
        <section id="scheduler">
            <h2>Sleep Schedule Configuration</h2>

            <label for="currentBedtime">Current Bedtime</label>
            <input type="text" id="currentBedtime" placeholder="21:30">

            <label for="targetBedtime">Target Bedtime</label>
            <input type="text" id="targetBedtime" placeholder="06:00">

            <label for="sleepHours">Required Sleep (Hours)</label>
            <input type="number" id="sleepHours"
                   min="0.1" max="24" step="0.5">

            <label for="shiftDirection">Shift Direction</label>
            <select id="shiftDirection">
                <option value="later">Later</option>
                <option value="earlier">Earlier</option>
            </select>

            <button id="generateButton">Generate Schedule</button>
        </section>

        <section id="results">
            <h2>Generated Schedule</h2>

            <div id="scheduleOutput">
                Your schedule will appear here.
            </div>

            <button type="button" id="showSleepReportButton" hidden>
                Open Daily Sleep Report
            </button>
        </section>

        <section id="sleepReport" hidden>
            <h2>Daily Sleep Report</h2>

            <p>
                Record your actual sleep times and sleep quality
                to help Genesis evaluate your sleep history.
            </p>

            <label for="sleepDate">Sleep Date</label>
            <input type="date" id="sleepDate" required>

            <label for="actualBedtime">Actual Bedtime</label>
            <input type="text" id="actualBedtime"
                   placeholder="21:30" required>

            <label for="actualWakeTime">Actual Wake Time</label>
            <input type="text" id="actualWakeTime"
                   placeholder="06:00" required>

            <label for="sleepQuality">Sleep Quality</label>
            <select id="sleepQuality" required>
                <option value="">Select sleep quality</option>
                <option value="poor">Poor</option>
                <option value="okay">Okay</option>
                <option value="great">Great</option>
            </select>

            <label for="sleepNotes">Additional Notes (Optional)</label>
            <textarea id="sleepNotes"
                      placeholder="Record interruptions or other relevant observations."
                      rows="3"></textarea>

            <button type="button" id="saveSleepReportButton">
                Save Sleep Report
            </button>

            <div id="sleepReportStatus" aria-live="polite"></div>
        </section>
    </main>

    <script src="js/schedule.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js")
                    .then(() => console.log("Genesis offline support enabled."))
                    .catch(error => console.error(
                        "Service worker registration failed:", error
                    ));
            });
        }
    </script>

</body>
</html>
